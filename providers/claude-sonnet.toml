# Official API endpoint. Credentials are read from the environment.
# Explicit model from the saved claude-sonnet configuration; override --model for another study version.
[model]
provider = "anthropic"
model = "claude-sonnet-5"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
timeout_seconds = 600
max_retries = 2
retry_backoff_seconds = 1.0

[claude]
config_mode = "isolated"
command_model = "claude-sonnet-5"
default_model = "claude-sonnet-5"
